<linearGradient id="sheen" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".045"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
<clipPath id="clip"><rect x="4" y="4" width="472" height="204" rx="24"/></clipPath>
